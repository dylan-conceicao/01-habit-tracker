<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Habit Tracker</h1>

    <form id="habit-form">
      <input id="habit-input" type="text" placeholder="Add a habit, like drink water" maxlength="60">
      <button type="submit">Add</button>
    </form>

    <ul id="habit-list"></ul>
    <button id="reset-button" type="button">Reset all habits</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
